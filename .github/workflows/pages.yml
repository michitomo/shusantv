name: scrape-and-deploy

on:
  schedule:
    # JST 平日 8:45〜18:55 に5分間隔 (UTC 23:45〜09:55)。cron遅延は許容
    - cron: "45,50,55 23 * * 0-4"
    - cron: "*/5 0-9 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  actions: write # schedule 自動停止の回避(下の Keep schedule alive)
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Scrape live streams
        run: node scripts/scrape.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      # 公開リポジトリは60日間コミットがないと schedule が自動停止される(disabled_inactivity)。
      # 平日朝の初回 cron で enable API を叩き、無活動カウンタをリセットしておく
      - name: Keep schedule alive
        if: github.event.schedule == '45,50,55 23 * * 0-4'
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
