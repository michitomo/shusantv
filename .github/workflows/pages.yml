name: scrape-and-deploy

on:
  schedule:
    # JST 平日 8:47〜18:57 に約5分間隔 (UTC)。正時を外して cron の遅延を避ける。
    # 式そのものを変えると、止まった schedule の再登録になる。
    - cron: "47,52,57 23 * * 0-4"
    - cron: "2,7,12,17,22,27,32,37,42,47,52,57 0-9 * * 1-5"
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - ".github/schedule-keepalive"

permissions:
  contents: write # 平日朝に活動記録をコミットして 60 日無活動の schedule 停止を防ぐ
  pages: write
  actions: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable schedule if GitHub disabled it
        continue-on-error: true
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/pages.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test listing and discovery
        run: node --test lib/*.test.mjs
      - name: Scrape live streams
        run: node scripts/scrape.mjs
        env:
          PREVIOUS_STREAMS_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/streams.json
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
      # 公開リポジトリは60日間コミットがないと schedule が自動停止される。
      # enable API は停止を解除するだけで、無活動のカウントは戻らない。
      # 平日朝に日付ファイルをコミットし、次回の60日をリセットする。
      - name: Keep schedule alive
        if: github.event_name == 'schedule' && github.event.schedule == '47,52,57 23 * * 0-4'
        continue-on-error: true
        run: |
          today=$(TZ=Asia/Tokyo date +%F)
          stamp=".github/schedule-keepalive"
          if [ -f "$stamp" ] && [ "$(cat "$stamp")" = "$today" ]; then
            exit 0
          fi
          echo "$today" > "$stamp"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$stamp"
          git commit -m "chore: keep scheduled scrape alive ($today)"
          git push origin "HEAD:${GITHUB_REF_NAME}"
